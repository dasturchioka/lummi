name: E2E
# Seam 3 of ADR 0028: one happy-path browser test (apps/miniapp/e2e) against a disposable stack.
# A workflow of its own, not a job in ci.yml: deploy.yml calls ci.yml as its `check`, so a job there
# would hold every deploy back on a flake. #72: it runs on the pull request (stage-1 → main, so on
# every stage-1 push) and by hand, not on every branch push.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: [self-hosted, lummi]
    timeout-minutes: 25
    env:
      # its own stack and ports on the staging VPS, never staging's (#72)
      E2E_COMPOSE_PROJECT: lummi-e2e-ci
      API_PORT: '4291'
      MINIAPP_PORT: '5291'
      POSTGRES_HOST_PORT: '2591'
      REDIS_HOST_PORT: '2691'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Chromium's system libraries are installed on the runner host once (#72; no sudo here);
      # the browser itself stays in ~/.cache/ms-playwright between runs
      - run: npx playwright install chromium
      - name: E2E
        # The bot token only signs initData for the API under test; it is not a real bot.
        env:
          BOT_TOKEN: '123456789:e2e-signing-key-not-a-real-bot'
          SESSION_SECRET: e2e-session-secret-e2e-session-secret
        run: npm run e2e -w @lummi/miniapp
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/miniapp/playwright-report
            apps/miniapp/test-results
          retention-days: 7

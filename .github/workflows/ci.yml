name: CI
on:
  push:
    # stage-1 and main run these checks through deploy.yml (a reusable call), not twice
    branches-ignore: [stage-1, main]
  pull_request:
  workflow_call:

jobs:
  check:
    # stage-1's pushes are checked by deploy.yml; its open pull request to main would run the same
    # suite a second time on the same commit
    if: github.event_name != 'pull_request' || github.head_ref != 'stage-1'
    # public repo (2026-11-18): GitHub-hosted runners are free and unlimited, and no runner of ours
    # may ever take a fork's pull request
    runs-on: ubuntu-latest
    # A newer push to the same branch makes the running check pointless (#72). When
    # deploy.yml calls this, each run gets a group of its own, so a deploy's check is never cancelled.
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref != 'refs/heads/stage-1' && github.ref != 'refs/heads/main' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
      cancel-in-progress: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Turbo's local cache across runs: a package whose inputs (and its dependencies' typecheck)
      # did not change replays its lint, typecheck and test instead of running them again (#58)
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: npx turbo run lint typecheck test
      - run: npm run build -w @lummi/miniapp
      - run: npm run size -w @lummi/miniapp

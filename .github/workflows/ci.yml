name: CI
on:
  push:
    # stage-1 and main run these checks through deploy.yml (a reusable call), not twice
    branches-ignore: [stage-1, main]
  pull_request:
  workflow_call:

jobs:
  check:
    # stage-1's pushes are checked by deploy.yml; its open pull request to main would run the same
    # suite a second time on the same commit
    if: github.event_name != 'pull_request' || github.head_ref != 'stage-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Turbo's local cache across runs: a package whose inputs (and its dependencies' typecheck)
      # did not change replays its lint, typecheck and test instead of running them again (#58)
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: npx turbo run lint typecheck test
      - run: npm run build -w @lummi/miniapp
      - run: npm run size -w @lummi/miniapp

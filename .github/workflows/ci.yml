name: CI
on:
  push:
    # stage-1 and main run these checks through deploy.yml (a reusable call), not twice
    branches-ignore: [stage-1, main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test
      - run: npm run build -w @lummi/miniapp
      - run: npm run size -w @lummi/miniapp

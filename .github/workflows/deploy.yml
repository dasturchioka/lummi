name: Deploy staging
# ADR 0024. Stage 1 lands on `stage-1`, so it deploys too; production deploys only from `v*` tags (not here).
on:
  push:
    branches: [stage-1, main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { target: api, image: lummi-api }
          - { target: admin, image: lummi-admin }
          - { target: web, image: lummi-web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # The bot link is the only value baked into a build (Mini App share buttons).
          build-args: |
            VITE_BOT_LINK=${{ vars.STAGING_BOT_LINK }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the Compose file
        env:
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes docker-compose.yml "$TARGET:/opt/lummi-staging/docker-compose.yml"
      - name: Pull, migrate, seed, start, set the webhook
        env:
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$TARGET" \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_ACTOR='$GHCR_ACTOR' bash -s -- '${{ github.sha }}' '${{ env.OWNER }}'" \
            < deploy/remote-deploy.sh
      - name: Smoke test
        env:
          DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "https://api.${DOMAIN}/health"
          curl -fsS -o /dev/null "https://${DOMAIN}/"

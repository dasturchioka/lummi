name: Deploy staging
# ADR 0024. Stage 1 lands on `stage-1`, so it deploys too; production deploys only from `v*` tags (not here).
on:
  push:
    branches: [stage-1, main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # #72: a stage-1 merge whose tree is exactly a ticket branch that already passed CI needs no second
  # run of the whole suite
  gate:
    if: github.ref == 'refs/heads/stage-1' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      check: ${{ steps.tree.outputs.check }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          shas=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/ci.yml/runs?status=success&per_page=40" |
            jq -r '.workflow_runs[].head_sha' | sort -u)
          for sha in $shas; do
            git cat-file -e "$sha" 2>/dev/null || git fetch -q --depth=1 origin "$sha" 2>/dev/null || continue
            if [ "$(git rev-parse "$sha^{tree}")" = "$tree" ]; then
              echo "tree $tree already passed CI at $sha: no second check"
              echo "check=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "check=true" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # built while the checks run (#58); nothing deploys until both pass
  images:
    if: github.ref == 'refs/heads/stage-1' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { target: api, image: lummi-api }
          - { target: admin, image: lummi-admin }
          - { target: web, image: lummi-web }
          # Built and pushed always; it runs only where COMPOSE_PROFILES=userbot (docs/run-guide.md).
          - { target: userbot, image: lummi-userbot }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "ref=$(echo "$REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # The bot link is the only value baked into a build (Mini App share buttons).
          build-args: |
            VITE_BOT_LINK=${{ vars.STAGING_BOT_LINK }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: [gate, check, images]
    # the check either passed or was skipped by the gate (its tree passed CI already)
    if: >-
      always() && (github.ref == 'refs/heads/stage-1' || github.ref == 'refs/heads/main') &&
      needs.gate.result == 'success' && needs.images.result == 'success' &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.gate.outputs.check == 'false'))
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy" && chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
      - name: Copy the Compose file
        env:
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
        run: |
          scp -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" docker-compose.yml deploy/remote-deploy.sh "$TARGET:/opt/lummi-staging/"
      - name: Pull, migrate, seed, start
        env:
          TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # The token is the only stdin line, read by the remote shell: never in argv, never in `ps`.
          # The script runs from the copied file, not from stdin: `docker compose run` reads stdin and
          # would swallow the rest of a piped script (the first deploy stopped after migrating, exit 0).
          printf '%s\n' "$GHCR_TOKEN" |
            ssh -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$TARGET" \
              "read -r GHCR_TOKEN; export GHCR_TOKEN; bash /opt/lummi-staging/remote-deploy.sh '$SHA' '$OWNER' '$GHCR_ACTOR' </dev/null"
      - name: Smoke test
        env:
          DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "https://api.${DOMAIN}/health"
          curl -fsS -o /dev/null "https://${DOMAIN}/"

name: Deploy production
# ADR 0024: production deploys only from `v*` tags. Same host as staging for now (shared VPS, docs/run-guide.md
# → Production): its own Compose project `lummi` in /opt/lummi, Caddy on 127.0.0.1:4280 behind the host nginx.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing v* tag to (re)deploy'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # the tagged tree must have passed CI already (it went through stage-1 and staging); otherwise run it now
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      check: ${{ steps.tree.outputs.check }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in v*) ;; *) echo "not a v* tag: $tag"; exit 1 ;; esac
          if [ -z "$INPUT_TAG" ] && [ "$REF_TYPE" != tag ]; then echo "push of a non-tag ref"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          shas=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/ci.yml/runs?status=success&per_page=60" |
            jq -r '.workflow_runs[].head_sha' | sort -u)
          shas="$shas $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy.yml/runs?status=success&per_page=30" |
            jq -r '.workflow_runs[].head_sha' | sort -u)"
          for sha in $shas; do
            git cat-file -e "$sha" 2>/dev/null || git fetch -q --depth=1 origin "$sha" 2>/dev/null || continue
            if [ "$(git rev-parse "$sha^{tree}")" = "$tree" ]; then
              echo "tree $tree already passed at $sha: no second check"
              echo "check=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "check=true" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Production images carry the tag name (v1.0.0), never a bare SHA: the web image bakes in the production
  # bot link, so it must not collide with the staging image of the same commit.
  images:
    needs: gate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { target: api, image: lummi-api }
          - { target: admin, image: lummi-admin }
          - { target: web, image: lummi-web }
          - { target: userbot, image: lummi-userbot }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.gate.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_BOT_LINK=${{ vars.PROD_BOT_LINK }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ needs.gate.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}

  deploy:
    needs: [gate, check, images]
    if: >-
      always() && needs.gate.result == 'success' && needs.images.result == 'success' &&
      (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.gate.outputs.check == 'false'))
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.gate.outputs.tag }}
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy" && chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
      - name: Copy the Compose file
        env:
          TARGET: ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}
        run: |
          scp -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" docker-compose.yml deploy/remote-deploy.sh "$TARGET:/opt/lummi/"
      - name: Pull, migrate, seed, start
        env:
          TARGET: ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          # the token is the only stdin line (never in argv or `ps`); see deploy.yml
          printf '%s\n' "$GHCR_TOKEN" |
            ssh -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$TARGET" \
              "read -r GHCR_TOKEN; export GHCR_TOKEN DEPLOY_DIR=/opt/lummi; bash /opt/lummi/remote-deploy.sh '$TAG' '$OWNER' '$GHCR_ACTOR' </dev/null"
      - name: Smoke test
        env:
          DOMAIN: ${{ vars.PROD_DOMAIN }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "https://api.${DOMAIN}/health"
          curl -fsS -o /dev/null "https://${DOMAIN}/"
